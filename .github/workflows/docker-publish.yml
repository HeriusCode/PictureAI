name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        default: tagname
      api_base_url:
        description: Backend API URL embedded during the frontend build
        required: true
        default: http://localhost:8000
      use_mock:
        description: Build with mock data enabled
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag || 'tagname' }}
      API_BASE_URL: ${{ inputs.api_base_url || 'http://localhost:8000' }}
      USE_MOCK: ${{ inputs.use_mock || 'false' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pictureai:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_USE_MOCK=${{ env.USE_MOCK }}
